<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TETH footer2 mock: band</title>
<style>
  html,body{margin:0;padding:0;background:#0f1012;color:#e9e9ea;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .ctx{height:300px;box-sizing:border-box;padding:96px 40px 0}
  .ctx h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em;color:rgba(233,233,234,.32)}
  .ctx p{margin:14px 0 0;max-width:560px;color:rgba(233,233,234,.18)}
  .gft{margin-top:0}

  /* band 시안: 라임 푸터 최상단 가장자리의 슬림 풀폭 밴드. 밴드 아래 가장자리가 hairline. */
  .gft .gft-in{padding-top:0}
  .fb-band{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:64px;padding:9px 0;box-sizing:border-box;border-bottom:1px solid rgba(12,13,15,.35);margin-bottom:48px}
  .fb-crs{font-size:14px;line-height:1.5;color:#0c0d0f;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;padding:10px 0;white-space:nowrap}
  .fb-crs:hover{text-decoration-thickness:2px}
  .fb-follow{display:flex;align-items:center;gap:6px;margin-left:auto}
  .fb-follow-label{font-size:12px;font-weight:600;letter-spacing:.06em;color:#0c0d0f;margin-right:6px;white-space:nowrap}
  .fb-sns{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:#0c0d0f;text-decoration:none;flex:0 0 44px}
  .fb-sns svg{display:block;width:20px;height:20px;fill:currentColor}
  .fb-sns:hover{background:rgba(12,13,15,.08)}
  .gft a.fb-sns:focus-visible{outline:2px solid #0c0d0f;outline-offset:0;border-radius:50%}
  @container (max-width:600px){
    .fb-band{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 0 6px;margin-bottom:40px}
    .fb-follow{margin-left:0}
    .fb-crs{padding:12px 0 8px}
  }
</style>
</head>
<body>
  <section class="ctx">
    <h1>내 돈은 어떻게 지키나요</h1>
    <p>TETH는 조회와 주문 권한만 사용하며 출금 권한은 요청하지 않습니다.</p>
  </section>

  <script src="../../site-config.js?v=2"></script>
  <script src="../../site-footer.js?v=1"></script>
  <script src="icons.js"></script>
  <div id="site-footer"></div>
  <script>TETH_FOOTER.mount(document.getElementById('site-footer'),{base:'../../'});</script>

  <script>
  (function(){
    var inEl = document.querySelector('.gft-in');
    if(!inEl) return;
    var soc = (window.TETH_CONFIG && TETH_CONFIG.social) || {};
    var ic = window.TETH_SNS_ICONS || {};
    var order = [['x','X'],['instagram','Instagram'],['youtube','YouTube'],['telegram','Telegram']];
    var sns = order.map(function(o){
      return '<a class="fb-sns" href="'+soc[o[0]]+'" target="_blank" rel="noopener noreferrer" aria-label="'+o[1]+'">'
        +'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="'+ic[o[0]]+'"/></svg></a>';
    }).join('');
    var band = document.createElement('div');
    band.className = 'fb-band';
    band.innerHTML = '<a class="fb-crs" href="../../policies/teth-crs.pdf" target="_blank" rel="noopener noreferrer">고객 관계 요약</a>'
      +'<div class="fb-follow"><span class="fb-follow-label">팔로우하세요</span>'+sns+'</div>';
    inEl.insertBefore(band, inEl.firstChild);

    var ps = document.querySelectorAll('.gft-copy p');
    if(ps.length >= 4){
      ps[0].textContent = 'TETH는 고객이 말로 정한 전략을 AI 에이전트가 판단하고 실행하는 AI 트레이딩 서비스입니다. 고객이 각 거래에 직접 개입하지 않아도 AI 에이전트가 주식, 옵션, 암호화폐 거래를 실행할 수 있으며, 모든 거래는 고객이 연결한 Bitget 계정 안에서 이루어집니다.';
      ps[1].innerHTML = '<b>Bitget이 선정한 최고의 AI입니다.</b>';
      ps[2].textContent = 'TETH는 조회와 주문 권한만 사용하며 출금 권한은 요청하지 않습니다. 거래 한도는 고객이 직접 설정하고, 언제든지 전략을 중지하거나 연결을 해제할 수 있습니다. 판단 근거는 거래마다 기록으로 남깁니다.';
      ps[3].textContent = '© 2026 TETH AI. 모든 권리 보유.';
    }
  })();
  </script>
</body>
</html>
