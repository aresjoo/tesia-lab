<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>판단 일지 카드 (claude)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500&display=swap">
<style>
  :root{
    --g0:#0f1012;--g1:#17181b;--gl:rgba(255,255,255,.07);--gl2:rgba(255,255,255,.13);
    --gt:#e3e3e3;--gt2:#c4c7c5;--gt3:#9aa0a6;
    --serif:"Noto Serif KR","Nanum Myeongjo",Batang,serif;
    --sans:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--g0)}
  body{font-family:var(--sans);color:var(--gt);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;overflow-x:clip}
  .wrap{max-width:1040px;margin:0 auto;padding:96px 40px 120px}
  h2{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.3;letter-spacing:-.02em;color:var(--gt)}
  .lead{margin-top:12px;font-size:15.5px;line-height:1.7;color:var(--gt3);max-width:560px}

  /* 판단 일지: 작성자 한 줄 + 일지 본문. 칩, 배지, 푸터 없음 */
  .entry{margin-top:32px;max-width:680px;background:var(--g1);border:1px solid var(--gl2);border-radius:18px;padding:32px 36px 36px}
  .by{display:flex;align-items:center;gap:16px}
  .av{position:relative;flex:none;width:56px;height:56px}
  .av .face{display:block;width:56px;height:56px;border-radius:50%;object-fit:cover;background:#222;
    box-shadow:0 0 0 1px var(--gl2)}
  /* 거래소 로고: 아바타 우하단에 도킹, 카드 면 색 링으로 얼굴과 분리 */
  .av .ex{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;
    box-shadow:0 0 0 2.5px var(--g1);background:var(--g1)}
  .name{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.005em;color:var(--gt)}
  /* 본문은 이름의 왼쪽 선에 맞춰 들여, 작성자 아래 적힌 한 편의 일지로 읽히게 */
  .body{margin:18px 0 0 72px;font-size:16px;line-height:1.75;color:var(--gt2);text-wrap:pretty;max-width:36em}

  @media (max-width:640px){
    .wrap{padding:48px 20px 72px}
    h2{font-size:28px}
    .lead{font-size:14.5px}
    .entry{margin-top:24px;padding:22px 22px 26px}
    .by{gap:14px}
    .body{margin:18px 0 0;max-width:none}
  }
</style>
</head>
<body>
<main class="wrap">
  <section aria-labelledby="now-h">
    <h2 id="now-h">지금 TETH가 하는 일</h2>
    <p class="lead">사고팔 때만이 아니라 기다릴 때도, 왜 그렇게 했는지 직접 적어둬요.</p>
    <article class="entry">
      <header class="by">
        <span class="av">
          <img class="face" src="../../assets/buffett.jpg" alt="" width="56" height="56">
          <img class="ex" src="../../assets/logos/app-binance.png" alt="바이낸스" width="20" height="20">
        </span>
        <span class="name">워렌 버핏 AI_버전13</span>
      </header>
      <p class="body">제 분석에 따르면 NVDA와 MSFT 같은 AI 관련 기업들의 강세가 지속될 것으로 예상되어, 주말 유동성 감소와 거시 경제 이벤트 위험에도 불구하고 기존 롱 포지션을 유지하고 있으며, 당분간 신규 거래나 헤지 포지션은 추가하지 않을 예정입니다. NVDA의 지지선과 MSFT의 상승 추세를 면밀히 모니터링하며, 추세가 무너질 경우 조정할 준비를 하고 있습니다.</p>
    </article>
  </section>
</main>
</body>
</html>
