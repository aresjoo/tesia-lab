<script>
'use strict';
const strategies=JSON.parse(document.getElementById('message-data').textContent);
const root=document.getElementById('conversations');
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
function appendText(parent,text){
  const re=/[+-]\d+(?:\.\d+)?%/g;let pos=0;
  for(const match of text.matchAll(re)){parent.append(document.createTextNode(text.slice(pos,match.index)));parent.append(el('span',match[0][0]==='+'?'gain':'loss',match[0]));pos=match.index+match[0].length;}
  parent.append(document.createTextNode(text.slice(pos)));
}
function content(text,now){
  const p=el('p','copy'+(now?'':' preview'));
  const boundary=text.search(/\.(?:\s|$)/);
  if(boundary>=0){const strong=el('strong');appendText(strong,text.slice(0,boundary+1));p.append(strong);appendText(p,text.slice(boundary+1));}else appendText(p,text);
  return p;
}
function message(s,m,i){
  const li=el('li','message'+(m.k==='now'?' current':''));li.dataset.index=i;
  const avatar=el('img','avatar');avatar.src=s.avatar;avatar.alt='';avatar.width=36;avatar.height=36;
  const main=el('article','message-main');main.setAttribute('aria-label',s.name+' '+m.tag+' '+m.date);
  const byline=el('header','byline');byline.append(el('span','name',s.name),el('span','tag'+(m.k==='now'?' tag-now':''),m.tag));
  byline.append(el('span','date',m.from?m.from+' ~ '+m.date:m.date));
  const bubble=el('div','bubble');const p=content(m.t,m.k==='now');p.id=s.id+'-text-'+i;bubble.append(p);
  if(m.k!=='now'){
    const btn=el('button','expand');btn.type='button';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls',p.id);btn.setAttribute('aria-label',m.date+' '+m.tag+' 메시지 펼치기');
    const label=el('span','','펼쳐 읽기');const icon=el('span','chevron');icon.setAttribute('aria-hidden','true');btn.append(label,icon);
    btn.addEventListener('click',()=>{const open=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!open));p.classList.toggle('preview',open);label.textContent=open?'펼쳐 읽기':'접기';btn.setAttribute('aria-label',m.date+' '+m.tag+' 메시지 '+(open?'펼치기':'접기'));});bubble.append(btn);
  }
  main.append(byline,bubble);
  if(m.cnt&&m.from){const note=el('p','grouped');note.append(el('span','',m.cnt+'번 같은 판단'),'을 한 대화로 모았어요');main.append(note);}
  li.append(avatar,main);return li;
}
for(const s of strategies){
  const section=el('section','strategy');section.id=s.id;section.setAttribute('aria-labelledby',s.id+'-title');
  const head=el('header','section-head');const title=el('div');title.append(el('p','kind',s.kind));const h=el('h2','section-title',s.name);h.id=s.id+'-title';title.append(h);
  const all=el('button','history-toggle');all.type='button';all.setAttribute('aria-expanded','false');all.setAttribute('aria-controls',s.id+'-older');all.setAttribute('aria-label',s.name+' 전체 기록 8개 보기');
  const allLabel=el('span','','전체 기록');const count=el('span','count','8');const arrow=el('span','arrow','↗');arrow.setAttribute('aria-hidden','true');all.append(allLabel,count,arrow);head.append(title,all);
  const list=el('ol','messages');s.msgs.slice(0,3).forEach((m,i)=>list.append(message(s,m,i)));
  const older=el('ol','messages older');older.id=s.id+'-older';older.start=4;older.hidden=true;s.msgs.slice(3).forEach((m,i)=>older.append(message(s,m,i+3)));
  const moreWrap=el('div','more-wrap');const more=el('button','more','이전 대화 5개 더 보기');more.type='button';more.setAttribute('aria-controls',older.id);more.setAttribute('aria-expanded','false');moreWrap.append(more);
  const end=el('p','end','첫 인사까지의 기록이에요');end.hidden=true;
  function toggle(open,focusOlder){older.hidden=!open;end.hidden=!open;moreWrap.hidden=open;all.setAttribute('aria-expanded',String(open));more.setAttribute('aria-expanded',String(open));allLabel.textContent=open?'최근 대화만':'전체 기록';count.textContent=open?'3':'8';arrow.textContent=open?'↑':'↗';all.setAttribute('aria-label',s.name+(open?' 최근 대화 3개만 보기':' 전체 기록 8개 보기'));if(focusOlder){const first=older.querySelector('article');first.tabIndex=-1;first.focus({preventScroll:true});first.scrollIntoView({block:'start'});}}
  all.addEventListener('click',()=>toggle(older.hidden,false));more.addEventListener('click',()=>toggle(true,true));
  section.append(head,list,older,moreWrap,end);root.append(section);
}
</script>
